<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catailor · 写作台</title><link rel="stylesheet" href="/studio.css"><script src="/studio.js" defer></script></head>
<body><header class="studio-header"><a class="brand" href="/">☾ Catailor <span>写作台</span></a><span class="local-badge">只在本机打开</span><a href="https://catailor.github.io/" target="_blank" rel="noopener">查看博客 ↗</a><a id="private-link" target="_blank" rel="noopener">私人手记 ↗</a><button id="private-publish">发布私人手记</button></header>
<main class="studio-shell"><aside class="library"><div class="library-top"><h1>把今天写下来。</h1><p>草稿会留在本机，准备好了再发布。</p><label for="new-day">记录日期</label><input id="new-day" type="date"><div class="new-buttons"><button id="new-quick" class="primary">＋ 日语速记</button><button id="new-full">完整日记</button><button id="new-post">普通文章</button></div><label for="filter">查找文章</label><input id="filter" type="search" placeholder="标题或日期"></div><nav id="post-list" aria-label="文章和草稿"></nav></aside>
<section class="desk"><div class="desk-toolbar"><div><span id="document-state">尚未选择文章</span><p id="save-status" role="status">从左侧新建，或继续一篇草稿。</p></div><button id="save" disabled>保存到本机</button><button id="publish" class="primary" disabled>预览发布</button></div>
<div id="empty" class="desk-empty"><span>あ</span><h2>一点词语，一点日常。</h2><p>今天学到了什么？先从一篇速记开始。</p></div>
<div id="editor" hidden><div class="metadata"><label class="title-label">标题<input id="title" placeholder="例如：第一次区分 は 和 が" maxlength="200"></label><label>日期<input id="date" type="date"></label><label class="summary-label">摘要 <span>可留空，发布时自动提取</span><input id="summary" maxlength="500" placeholder="用一句话记住今天学了什么"></label></div>
<div class="writing-tools"><button id="add-heading">插入小标题</button><button id="word-open">＋ 添加词语</button><label class="upload-button" for="image">插入图片<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><span>左边写，右边看效果</span></div>
<div class="writing-split"><label class="body-label">正文<textarea id="body" spellcheck="false" placeholder="写下今天的记录…"></textarea></label><section class="preview-pane" aria-label="文章预览"><div>正文预览</div><iframe id="preview" sandbox="" title="正文预览"></iframe></section></div></div>
<section class="publication"><span class="publication-dot"></span><p id="publication-status" role="status">尚未发起发布</p><a href="https://github.com/Catailor/catailor.github.io/actions" target="_blank" rel="noopener">查看部署记录 ↗</a></section></section></main>
<dialog id="review"><h2>这次发布的内容</h2><p class="dialog-hint">确认后会上传到博客。其他草稿继续留在本机。</p><h3 id="review-title"></h3><p id="review-summary"></p><p id="review-category"></p><p id="review-assets"></p><div class="dialog-actions"><button id="review-close">继续编辑</button><button id="review-confirm" class="primary">确认发布</button></div></dialog>
<dialog id="word-dialog"><h2>记住一个新词</h2><form id="word-form"><div class="word-fields"><label>单词<input id="word" required maxlength="100"></label><label>假名<input id="kana" maxlength="100"></label><label>词性<input id="pos" maxlength="40"></label><label>中文意思<input id="meaning" required maxlength="200"></label><label class="wide">例句与用法<input id="example" maxlength="400"></label></div><p class="dialog-hint">会写入这篇日记的词语表。发布日语日记后，词语本自动汇总。</p><div class="dialog-actions"><button id="word-close" type="button">取消</button><button type="submit" class="primary">加入日记</button></div></form></dialog>
</body></html>
