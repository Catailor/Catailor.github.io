<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作台 · Catailor</title><link rel="stylesheet" href="/editor.css"><link rel="stylesheet" href="/studio.css"><script src="/editor.js" defer></script><script src="/studio.js" defer></script></head>
<body>
<aside class="navigation">
  <a class="brand" href="/">☾ <span>Catailor<small>我的写作台</small></span></a>
  <div class="create"><button id="new-post" class="primary">＋ 新建文章</button><button id="templates" title="从模板新建" aria-label="从模板新建">⌄</button></div>
  <nav aria-label="资料库"><button data-view="recent">◷ 最近写过</button><button data-view="all">▤ 全部文章</button><button data-view="draft">◌ 草稿</button><button data-view="published">✓ 已发布</button></nav>
  <div class="nav-heading"><span>我的系列</span><button id="new-series" aria-label="新建系列">＋</button></div><nav id="series-nav" aria-label="我的系列"></nav>
  <div class="nav-bottom"><button id="template-manage">▧ 管理模板</button><button id="private-open">♧ 私人手记</button><a href="https://catailor.github.io/" target="_blank" rel="noopener">打开博客 ↗</a><small>内容先存本机，发布后才公开</small></div>
</aside>
<section class="library" aria-label="文章列表">
  <header><div class="list-heading"><h1 id="view-title">最近写过</h1><button id="series-settings" hidden aria-label="编辑当前系列">···</button></div><p id="view-description">从上次停下的地方继续。</p><input id="filter" type="search" placeholder="查找文章…" aria-label="查找文章"><div id="series-actions" hidden><button id="series-write">＋ 在这里写一篇</button><button id="series-publish">更新线上目录</button></div></header>
  <div id="batch-bar" hidden><span id="batch-count"></span><button id="batch-add">加入系列</button><button id="batch-clear" aria-label="取消选择">×</button></div>
  <div id="post-list"></div><p id="list-empty" class="muted" hidden>这里还没有文章，写下第一篇吧。</p>
</section>
<main>
  <header class="workspace-bar"><div><span id="document-state">留一页给今天</span><span id="save-status" role="status" aria-live="polite"></span></div><div id="article-actions" hidden><button id="outline-toggle">大纲</button><button id="preview-open">预览</button><button id="settings-toggle">文章设置</button><button id="publish" class="primary">发布</button></div><div id="private-actions" hidden><button id="private-publish" class="primary">发布加密手记</button></div></header>
  <section id="empty"><span class="empty-mark">✎</span><h2>想写什么，就从这里开始。</h2><p>一段想法，一次学习，或只是今天的小事。</p><button id="empty-new" class="primary">新建文章</button><button id="empty-template">从模板开始</button><small>先写下来，系列和发布都可以稍后再说。</small></section>
  <section id="editor" hidden>
    <div class="paper"><input id="title" aria-label="文章标题" placeholder="无标题" maxlength="200"><div class="paper-meta"><button id="article-series">＋ 加入系列</button><span id="word-count"></span><button id="mode-toggle">Markdown</button></div><p id="compatibility" hidden>这篇包含公式或特殊语法，已保留原文编辑。点“预览”查看排版。</p><div id="rich-editor"></div><textarea id="source-editor" aria-label="Markdown 正文" placeholder="从这里开始写…" spellcheck="false" hidden></textarea></div>
    <aside id="settings" class="drawer" hidden><div class="drawer-title"><h2>文章设置</h2><button data-close="settings" aria-label="关闭文章设置">×</button></div><label>日期<input id="date" type="date"></label><label>摘要<textarea id="summary" rows="4" maxlength="500" placeholder="留空会自动摘取正文"></textarea></label><h3>所属系列</h3><div id="membership"></div><button id="article-new-series">＋ 新建系列</button><hr><button id="save-template">将这篇存为模板</button><button id="save">立即保存 <kbd>Ctrl S</kbd></button><p class="muted">自动保存的是本机内容。修改已发布文章后，需要再次发布才会更新博客。</p></aside>
    <aside id="outline" class="drawer" hidden><div class="drawer-title"><h2>文章大纲</h2><button data-close="outline" aria-label="关闭文章大纲">×</button></div><nav id="outline-list"></nav></aside>
  </section>
  <section id="private-panel" hidden><iframe id="private-frame" title="加密私人手记"></iframe></section>
  <footer id="publication-status" role="status" aria-live="polite"></footer>
</main>
<dialog id="form-dialog"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" data-dialog-close="form-dialog" aria-label="关闭">×</button></div><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><footer><button type="button" id="dialog-extra" hidden></button><button type="submit" id="dialog-submit" class="primary">保存</button></footer></form></dialog>
<dialog id="template-dialog"><div class="dialog-heading"><div><h2>从模板开始</h2><p class="muted">选择一张空白的框架，再写自己的内容。</p></div><button data-dialog-close="template-dialog" aria-label="关闭模板">×</button></div><div id="template-list"></div><footer><button id="template-new">＋ 新建模板</button></footer></dialog>
<dialog id="review"><div class="dialog-heading"><h2>发布这次内容</h2><button data-dialog-close="review" aria-label="关闭发布预览">×</button></div><h3 id="review-title"></h3><p id="review-summary"></p><p id="review-meta" class="muted"></p><p>发布开始后可以继续写。之后的修改会留在本机，等下次发布。</p><footer><button data-dialog-close="review">再看看</button><button id="review-confirm" class="primary">确认发布</button></footer></dialog>
<dialog id="preview-dialog"><div class="dialog-heading"><h2>阅读预览</h2><button data-dialog-close="preview-dialog" aria-label="关闭阅读预览">×</button></div><iframe id="preview" title="文章阅读预览" sandbox="allow-same-origin"></iframe></dialog>
</body></html>
