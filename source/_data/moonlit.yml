# 每篇文章的标题、摘要、类型（kind）、主题（topic）、封面（cover）
# 与是否精选（featured）现在直接写在文章开头的元数据里，写作台的「文章设置」可以修改。
# 旧版写法仍然兼容：在这里按文件名补充 posts.<文件名>.title / summary 等字段。
posts: {}

# 留言区（可选，默认关闭）。在 https://giscus.app/zh-CN 按提示开启仓库的 Discussions
# 并安装 giscus App，然后把页面上生成的四个值填到这里，重新部署后文章底部会出现留言区。
giscus:
  repo: ''          # 例如 Catailor/Catailor.github.io
  repo_id: ''
  category: Announcements
  category_id: ''
